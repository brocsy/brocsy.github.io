<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Torridge Male Voice Choir</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="logo-container">
      <h1>Torridge <span>Male Voice Choir</span></h1>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="contact.html" class="active">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <h2 class="section-title">Get in Touch</h2>
    <p style="margin-bottom: 1.5rem;">Interested in joining the choir, booking us for an event, or coming along to a rehearsal? Send us a message below.</p>

    <form class="contact-form">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject">
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>

      <button type="submit" class="btn">Send Message</button>
    </form>
  </main>

  <footer>
    <p>&copy; Torridge Male Voice Choir. All rights reserved.</p>
  </footer>

</body>
</html>
